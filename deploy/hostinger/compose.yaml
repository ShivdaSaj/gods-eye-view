# God's Eye View on a Hostinger VPS behind the shared Traefik container.
#
# Deploy with Hostinger's Docker Manager (project name `godseye`), or with
# `docker compose -p godseye -f compose.yaml up -d` on the VPS.
#
# Hostinger's Docker Manager does not build images, so instead of `build:` this
# runs the stock Node image and, on every start, clones (or fast-forwards) the
# repository into a named volume, installs dependencies and starts the same
# launcher the repo's Dockerfile uses. To ship a new commit: restart the
# project. `.env`, `.gev-cache` and `.gev-logs` live in the volume, so they
# survive restarts and updates.
#
# HTTPS: Traefik terminates TLS on its `websecure` entrypoint and issues the
# certificate through its `letsencrypt` resolver, matching the other apps on
# this VPS. `godseye.sajinshivdas.online` has an A record to the VPS.
services:
  gods-eye-view:
    # Same Node line as the Dockerfile; the full (non-slim) image ships git.
    image: node:24.22.2
    container_name: gods-eye-view
    restart: unless-stopped
    user: "node"
    working_dir: /home/node
    environment:
      - GEV_REPO=https://github.com/ShivdaSaj/gods-eye-view.git
      - GEV_BRANCH=main
      - HOST=0.0.0.0
      - PORT=4173
      - PUPPETEER_SKIP_DOWNLOAD=1
      # Accept the public hostname (Vite rejects unknown Host headers).
      - GEV_ALLOWED_HOSTS=godseye.sajinshivdas.online
      # POWER UP / Provider Settings: GEV_KEY_SETUP_TRUSTED_PEERS is left
      # unset, so the launcher trusts this project's Docker gateway, which is
      # where the loopback-only port below delivers an SSH tunnel from. The
      # public site still cannot reach the panel: Traefik adds X-Forwarded-*
      # headers and a non-local Host, and the panel refuses both. Open it with
      #   ssh -L 4173:127.0.0.1:14173 root@<vps>   ->  http://localhost:4173/?setup=1
      # Keys are saved to app/.env in the volume and survive restarts.
      # Set provider quotas and billing alerts first: every visitor uses them.
    command:
      - sh
      - -ec
      - |
        if [ -d app/.git ]; then
          git -C app fetch --depth 1 origin "$$GEV_BRANCH"
          git -C app reset --hard FETCH_HEAD
        else
          git clone --depth 1 --branch "$$GEV_BRANCH" "$$GEV_REPO" app
        fi
        cd app
        npm ci --no-audit --no-fund
        exec node scripts/docker-start.mjs
    volumes:
      # Mounted over /home/node so the empty volume inherits node's ownership.
      - godseye-data:/home/node
    # Public traffic goes through Traefik. This port is bound to the VPS's
    # loopback only, for the SSH tunnel to the POWER UP panel.
    ports:
      - "127.0.0.1:14173:4173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      # First start clones and installs dependencies.
      start_period: 600s
    labels:
      - traefik.enable=true
      - traefik.http.routers.godseye.rule=Host(`godseye.sajinshivdas.online`)
      - traefik.http.routers.godseye.entrypoints=websecure
      - traefik.http.routers.godseye.tls=true
      - traefik.http.routers.godseye.tls.certresolver=letsencrypt
      - traefik.http.services.godseye.loadbalancer.server.port=4173

volumes:
  godseye-data:
